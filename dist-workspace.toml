[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
#
# --- Homebrew: commented out on purpose, to be fixed later -------------------
#
# Everything below is the whole Homebrew release. It is off, not deleted, so
# turning it on is uncommenting these three lines plus `just dist-generate`.
#
# It cannot be turned on from this repository today: `publish-homebrew-formula`
# runs *after* the GitHub Release is created and pushes to the tap with
# HOMEBREW_TAP_TOKEN, which this repository does not have. Without the secret
# every release ends red having already published — worse than shipping no
# formula at all. The tap itself does exist (listepo/homebrew-tap, carrying
# ketch's cask), so the secret is the only missing piece; the steps are in
# docs/release.md, and it needs a decision from the owner, not a code change.
#
# Until then `brew install` is not a way to get rtok. The shell installer and
# `ketch install listepo/rtok` both read the Release archives directly and need
# no formula, so nothing is blocked by this being off.
#
# installers = ["shell", "homebrew"]
# tap = "listepo/homebrew-tap"
# publish-jobs = ["homebrew"]
# -----------------------------------------------------------------------------
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# T18.1: start a release from the Actions tab. dist creates the tag itself, so `bump.yml` only has
# to land the version commit; a tag push still triggers the workflow for anyone releasing by hand.
dispatch-releases = true
# T18.1: ship `rtok-update` beside `rtok` so an installed binary can update itself.
install-updater = true
# T18.6: the test gate is NOT a dist `plan-jobs` entry. dist's `host` job runs on
# `build-local-artifacts.result == 'skipped'`, and a failed custom job skips it — so a red gate
# would publish a Release with no binaries instead of stopping. The gate lives in the two
# workflows that dispatch this one (`bump.yml`, `release-plz.yml`), before any tag exists.
