# Graph tool bench schedule (T68.9). Live run: `RTOK_BENCH_LIVE=1 rtok bench --suite graph`.
# Dry run: `rtok bench --suite graph --dry-run`

[configs]
graph-on = "bench/configs/graph-on.json"
graph-off = "bench/configs/graph-off.json"

[[repos]]
name = "rtok"
path = "."

[[repos]]
name = "tokio"
path = "../tokio"

[[repos]]
name = "serde"
path = "../serde"

[[tasks]]
id = "registry"
repo = "rtok"
prompt = "Which Rust type registers catalogue plugins at startup? Answer with the type name only."
expect = "Registry"

[[tasks]]
id = "hook-path"
repo = "rtok"
prompt = "What CLI subcommand handles Claude Code hook events? One word."
expect = "hook"

[[tasks]]
id = "graph-tools"
repo = "rtok"
prompt = "Name one MCP tool the graph plugin exposes for symbol lookup."
expect = "symbol|callers|impact|outline|explore"

[[tasks]]
id = "store-backend"
repo = "rtok"
prompt = "What database backend holds the symbol index after P39?"
expect = "SQLite|sqlite"

[[tasks]]
id = "fail-open"
repo = "rtok"
prompt = "Hooks must exit 0 in at most how many milliseconds even on error?"
expect = "10"

[[tasks]]
id = "expand"
repo = "rtok"
prompt = "What rtok subcommand retrieves archived full text by id?"
expect = "expand"

[[tasks]]
id = "proxy-port"
repo = "rtok"
prompt = "Default local proxy port in config?"
expect = "8790"

[[tasks]]
id = "mcp-surface"
repo = "rtok"
prompt = "Which rtok subcommand serves MCP tools over stdio?"
expect = "mcp"

[[tasks]]
id = "memory-save"
repo = "rtok"
prompt = "Name the MCP tool that upserts a note by project+kind+title."
expect = "mem_save"

[[tasks]]
id = "inject-budget"
repo = "rtok"
prompt = "Which plugin owns SessionStart mode injections under a token budget?"
expect = "inject"

[[tasks]]
id = "archive-lossless"
repo = "rtok"
prompt = "Complete: anything shortened must be retrievable via rtok ___ <id>."
expect = "expand"

[[tasks]]
id = "graph-impact"
repo = "rtok"
prompt = "Which graph MCP tool walks caller chains up to a depth?"
expect = "impact"

[[tasks]]
id = "tokio-runtime"
repo = "tokio"
prompt = "What is the primary async runtime crate family in the Rust ecosystem?"
expect = "tokio"

[[tasks]]
id = "serde-format"
repo = "serde"
prompt = "Which crate is the de-facto Rust serialization framework?"
expect = "serde"
