# T18.5 (P18). release-plz keeps one "release: vX.Y.Z" pull request open on main; merging it
# starts the same release as the Bump workflow. dist still builds, tags and publishes.
[workspace]
# The groups of `just changelog`, so the PR's CHANGELOG.md matches the one release.sh writes.
changelog_config = "cliff.toml"
# The default for the workspace: not on crates.io — a release of the binary is a git tag plus
# dist archives. With no registry for the binary, release-plz reads the `v*` tags to know
# which version is out. `rtok-plugin-sdk` crates.io publish is paused for now.
publish = false
# dist creates both the tag and the GitHub Release from release.yml (dispatch-releases);
# release-plz creating either would race it.
git_tag_enable = false
git_release_enable = false
# A binary crate: cargo-semver-checks has nothing to compare.
semver_check = false
# The PR title is what release-plz.yml looks for in the merge commit.
pr_name = "release: v{{ version }}"
pr_labels = ["release"]

# T23.6 (D25). Plugin contract crate — crates.io publish paused for now (re-enable later).
# Keep the package stanza so release-plz still tracks it; semver_check off while not publishing.
[[package]]
name = "rtok-plugin-sdk"
publish = false
semver_check = false
