# Gated pipeline. Local ci.yml and the shared listepo/infra pipeline (CodeQL, Semgrep, Snyk;
# Rust CI stays local, `rust: false`) run in parallel; `gate` passes only when both succeeded.
# Anything downstream (deploy, release, publish) must `needs: gate`. Draft pull requests skip
# every job, the gate included, until marked ready. Secrets are passed explicitly.
# Shared workflows: https://github.com/listepo/infra/blob/main/docs/reusable-workflows.md
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/ci.yml
    # ci.yml's jobs request these (e.g. revert-on-failure); a called workflow cannot exceed them.
    permissions:
      contents: write
      pull-requests: write

  pipeline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: listepo/infra/.github/workflows/pipeline.yml@189816ac5a375e18e0235044970efcbc40e3cabd
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      rust: false
      codeql-languages: '["actions", "javascript-typescript", "python", "rust"]'
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  gate:
    needs: [ci, pipeline]
    # !cancelled(): report a failed, cancelled or skipped need, but do not hold a cancelled run.
    # Skipped on draft PRs like every other job, so a draft never leaves a green `gate` behind.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: listepo/infra/.github/actions/gate@189816ac5a375e18e0235044970efcbc40e3cabd
        with:
          needs: ${{ toJSON(needs) }}
