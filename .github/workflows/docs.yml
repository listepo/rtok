# Build the Hugo site (site/, `just site`) and deploy it to GitHub Pages through
# pyrlyn/infra's pages.yml. Tools (just, hugo, go) come from mise.toml.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    uses: pyrlyn/infra/.github/workflows/pages.yml@863d8960601216eec62d4aa78924f84ce61d72b9 # main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      fetch-depth: 0 # hugo.toml sets enableGitInfo; last-modified needs full history
      mise-install-args: just hugo go
      build-command: just site # --panicOnWarning: a broken mount or link fails the build
      artifact-path: site/public
