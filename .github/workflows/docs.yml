name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:

# One Pages deploy at a time; never cancel one half-done (same as listepo/ketch).
# PR / push builds share the group so they queue instead of racing the deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Each job installs only the mise.toml tools it runs (`install_args` below). Without these, a
  # bare `mise exec` (the justfile's `cargo`) first installs every other tool in mise.toml.
  MISE_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hugo.toml sets enableGitInfo; last-modified needs full history
      # Installs the Hugo, Go and just versions pinned in mise.toml, nothing else.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: just hugo go
          cache_key_prefix: mise-v1-site
      - run: just site # --panicOnWarning: a broken mount or link fails the build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    # Publishing is main-only; pull requests stop after the build above.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
