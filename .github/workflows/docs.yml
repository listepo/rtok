name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hugo.toml sets enableGitInfo; last-modified needs full history
      - uses: jdx/mise-action@v2 # installs the Hugo, Go and just versions pinned in mise.toml
      - run: just site # --panicOnWarning: a broken mount or link fails the build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    # Publishing is main-only; pull requests stop after the build above.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
