# T18.6 (P18). The gate `ci.yml` applies to every pull request, applied once more to the commit a
# release is cut from. A release is the one build nobody can re-run for themselves: a broken binary
# on the releases page is installed before anyone notices, and `rtok-update` hands it to everyone
# already running an older copy.
#
# It runs in the two workflows that dispatch `release.yml` (`bump.yml`, `release-plz.yml`), not
# inside `release.yml` itself. dist creates the tag and a draft Release in its `plan` job and lets
# `host` proceed when `build-local-artifacts` is `skipped` — which is what a failed dist custom job
# produces — so a gate in there would publish an empty Release rather than stop one. Here a red
# gate means no dispatch, no tag, and nothing on the releases page.
#
# Same matrix and same recipes as `ci.yml`, deliberately: a gate that tests something narrower than
# the one every pull request passed is a gate that lets through what that one caught.
name: verify

on:
  workflow_call:

env:
  # Each job installs only the mise.toml tools it runs (`install_args` below). Without these, a
  # bare `mise exec` (the justfile's `cargo`) first installs every other tool in mise.toml.
  MISE_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the Rust version pinned in mise.toml — same toolchain as local and as ci.yml — and
      # the rest `just check` runs (ci.yml's lint + check tool sets together).
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: just rust cargo:cargo-nextest node npm:vitest npm:vite npm:jscpd npm:oxlint npm:oxfmt python pipx:pytest
          cache_key_prefix: mise-v1-verify
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just check
      - run: just example
