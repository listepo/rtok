# T18.2 (P18). The entry point for a release: raise the version, land one commit, and start the
# dist Release workflow for it. Nobody types a version number.
#
# pyrlyn/infra's bump.yml runs verify (`just check` and `just example` on Linux and macOS, the
# gate every pull request passes) on this commit, then `tools/release.sh <level>`, which pushes
# the version commit and dispatches release.yml (dist-generated, never hand-edited). A
# workflow_dispatch sent with GITHUB_TOKEN starts a run, so no personal access token is needed.
# The preview stays local: `tools/release.sh <level> --dry-run`.
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      level:
        description: which part of the version to raise, if the current one is already released
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

jobs:
  bump:
    uses: pyrlyn/infra/.github/workflows/bump.yml@863d8960601216eec62d4aa78924f84ce61d72b9
    permissions:
      contents: write # push the version commit
      actions: write # dispatch release.yml, cancel-run
    with:
      level: ${{ inputs.level }}
      release-script: tools/release.sh
      verify-command: just check && just example
      mise-install-args: rust git-cliff
