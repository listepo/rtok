# T119. CodeQL code scanning for every language in the repo; results land in the Security tab.
# `just codeql` runs the same languages and suite locally. Repo default setup must stay off —
# GitHub rejects advanced-workflow uploads while it is on.
name: codeql

on:
  # Push to main, non-draft pull requests and the weekly schedule run this through
  # pipeline.yml (`workflow_call`), in parallel with the other checks and behind its `gate` job.
  workflow_call:
  workflow_dispatch:

jobs:
  analyze:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `build-mode: none` for all: Rust and the interpreted languages are extracted from source,
        # so no cargo build runs here.
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
