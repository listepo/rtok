name: ci

# Push to main arms `revert-on-failure` (auto-revert of a bad push, then a draft PR
# `revert-<branch>` that brings the work back — T84). That is intentional: main must stay
# green. Pull requests against main are the review gate; draft PRs are skipped so
# half-finished work does not burn runners. `workflow_dispatch` remains for manual runs
# (release branches, one-off checks).
on:
  # Push to main, non-draft pull requests and the weekly schedule run this through
  # pipeline.yml (`workflow_call`), in parallel with the other checks and behind its `gate` job.
  workflow_call:
  workflow_dispatch:

# A newer commit on the same ref cancels the previous run. github.workflow names the caller
# (pipeline or Dependabot), so their runs of this workflow on one pull request do not cancel
# each other; the `ci-` prefix keeps the group apart from pipeline.yml's own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; `revert-on-failure` widens its own.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # T261: no DWARF for workspace code in CI (dependencies have none already, Cargo.toml).
  # Smaller test binaries, less for the linker to move. A panic message still names
  # file:line (`Location` is compiled in); backtrace frames lose it. Local builds keep
  # `line-tables-only`.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # T261: everything that is not the test suite, once, on ubuntu, in parallel with `check`.
  # fmt, jscpd, oxlint and pytest do not depend on the OS; clippy here does not see
  # macOS-only `cfg` code, which the macOS test build still compiles.
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # cancel-run
    steps:
      - uses: actions/checkout@v7
      # Rust toolchain from the last run; mise then skips `rustup toolchain install`.
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # T261 experiment: also save on the branch's manual runs to measure a warm cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: just fmt-check lint build-min dup js python
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      # T23.6: `rtok-plugin-sdk` is published on release; a broken manifest fails here.
      - run: just publish-dry
      # T279: every plugin manifest and .rtok-plugin-version file must match Cargo.toml,
      # so a host that caches a plugin by its manifest version sees a new build.
      - run: tools/plugin-versions.sh --check "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-run

  check:
    # Draft PRs still emit synchronize; skip until ready_for_review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
      actions: write # cancel-run
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Rust toolchain from the last run; mise then skips `rustup toolchain install`.
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      # Installs the Rust version pinned in mise.toml — same toolchain as local.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Skip slow cache upload on PRs; restore still works from main keys.
          # T261 experiment: also save on the branch's manual runs to measure a warm cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      # The host plugin tests (vitest) run on Linux only. Node and vitest themselves come from
      # the mise cache above (keyed on mise.toml); this keeps vitest's own cacheDir
      # (`vitest.config.mjs`) warm, keyed on the plugin sources.
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('mise.toml', 'vitest.config.mjs', 'plugins/**/*.ts') }}
          restore-keys: vitest-${{ runner.os }}-
      # T310.9: build.rs embeds web/dist, so build the SPA before cargo; without it the binary
      # carries the "UI not built" page and the SPA-serving tests only see the placeholder.
      - run: just spa-install spa-build
      - run: just test
      - run: just example
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-run

  # T44.4: the agent installers write Windows paths and `%APPDATA%` files; run the suite there.
  # T83.4: a gate like `check` — a Windows-only failure fails the run and reverts main.
  # The suite run (~250 s) outweighs the build (~85 s) on this runner, so it is split across
  # `partitions` runners with nextest `--partition count:i/n`. Every shard builds the same
  # test binaries and runs its share; the job still fails if any shard fails.
  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: true
      matrix:
        partition: [1, 2]
        partitions: [2]
    name: windows (${{ matrix.partition }}/${{ matrix.partitions }})
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write # cancel-run
    # A hung test is killed by nextest's `terminate-after`; this caps everything else.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Rust toolchain from the last run; mise then skips `rustup toolchain install`.
      - id: rustup
        uses: ./.github/actions/rustup-toolchain-cache
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - if: steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rustup.outputs.path }}
          key: ${{ steps.rustup.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The shards build the same target dir; one upload is enough.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}
      - run: >-
          mise exec -- cargo nextest run --workspace
          --partition count:${{ matrix.partition }}/${{ matrix.partitions }}
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-run

  revert-on-failure:
    name: revert-on-failure
    needs: [lint, check, windows]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Revert, then a draft `revert-<branch>` PR that re-applies the work (T84, T253). The
      # shared action skips new branches, bot and auto-revert commits, and pushes touching
      # .github/ (GITHUB_TOKEN cannot push workflow files).
      - uses: pyrlyn/infra/.github/actions/revert-on-failure@863d8960601216eec62d4aa78924f84ce61d72b9
