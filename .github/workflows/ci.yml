name: ci

# Push to main arms `revert-on-failure` (auto-revert of a bad push, then a draft PR
# `revert-<branch>` that brings the work back — T84). That is intentional: main must stay
# green. Pull requests against main are the review gate; draft PRs are skipped so
# half-finished work does not burn runners. `workflow_dispatch` remains for manual runs
# (release branches, one-off checks).
on:
  # Push to main, non-draft pull requests and the weekly schedule run this through
  # pipeline.yml (`workflow_call`), in parallel with the other checks and behind its `gate` job.
  workflow_call:
  workflow_dispatch:

# A newer commit on the same ref cancels the previous run. github.workflow names the caller
# (pipeline or Dependabot), so their runs of this workflow on one pull request do not cancel
# each other; the `ci-` prefix keeps the group apart from pipeline.yml's own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; `revert-on-failure` widens its own.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # T261: no DWARF for workspace code in CI (dependencies have none already, Cargo.toml).
  # Smaller test binaries, less for the linker to move. A panic message still names
  # file:line (`Location` is compiled in); backtrace frames lose it. Local builds keep
  # `line-tables-only`.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # T261: everything that is not the test suite, once, on ubuntu, in parallel with `check`.
  # fmt, jscpd, oxlint and pytest do not depend on the OS; clippy here does not see
  # macOS-only `cfg` code, which the macOS test build still compiles.
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The webui crate is outside the workspace, with its own target dir (T81); without
          # it here every run compiled its 183 crates from scratch (T261).
          workspaces: |
            . -> target
            crates/rtok-webui -> target
          # T261 experiment: also save on the branch's manual runs to measure a warm cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: just fmt-check lint build-min dup js python
      # The webui crate is out of the workspace and builds for wasm only; nothing
      # above compiles it (T81).
      - run: just webui-check
      # T23.6: `rtok-plugin-sdk` is published on release; a broken manifest fails here.
      - run: just publish-dry

  check:
    # Draft PRs still emit synchronize; skip until ready_for_review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the Rust version pinned in mise.toml — same toolchain as local.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Skip slow cache upload on PRs; restore still works from main keys.
          # T261 experiment: also save on the branch's manual runs to measure a warm cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      # The host plugin tests (vitest) run on Linux only. Node and vitest themselves come from
      # the mise cache above (keyed on mise.toml); this keeps vitest's own cacheDir
      # (`vitest.config.mjs`) warm, keyed on the plugin sources.
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('mise.toml', 'vitest.config.mjs', 'plugins/**/*.ts') }}
          restore-keys: vitest-${{ runner.os }}-
      - run: just test
      - run: just example

  # T44.4: the agent installers write Windows paths and `%APPDATA%` files; run the suite there.
  # T83.4: a gate like `check` — a Windows-only failure fails the run and reverts main.
  # The suite run (~250 s) outweighs the build (~85 s) on this runner, so it is split across
  # `partitions` runners with nextest `--partition count:i/n`. Every shard builds the same
  # test binaries and runs its share; the job still fails if any shard fails.
  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
        partitions: [2]
    name: windows (${{ matrix.partition }}/${{ matrix.partitions }})
    runs-on: windows-latest
    # A hung test is killed by nextest's `terminate-after`; this caps everything else.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The shards build the same target dir; one upload is enough.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}
      - run: >-
          mise exec -- cargo nextest run --workspace
          --partition count:${{ matrix.partition }}/${{ matrix.partitions }}

  revert-on-failure:
    name: revert-on-failure
    needs: [lint, check, windows]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert commits from this push
        id: revert
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No parent (new branch); skip revert"
            exit 0
          fi
          subject=$(git log -1 --format=%s "$AFTER")
          author=$(git log -1 --format=%an "$AFTER")
          case "$subject" in
            "ci: auto-revert"*) echo "Already an auto-revert; skip"; exit 0 ;;
          esac
          if [ "$author" = "github-actions[bot]" ]; then
            echo "Last commit is from actions bot; skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent_count=$(git rev-list --parents -n 1 "$AFTER" | awk '{print NF}')
          if [ "$parent_count" -gt 2 ]; then
            git revert --no-edit -m 1 "$AFTER"
          else
            git revert --no-commit "$BEFORE".."$AFTER"
            if git diff --cached --quiet; then
              echo "Nothing to revert"
              exit 0
            fi
            short=$(git rev-parse --short "$AFTER")
            git commit -m "ci: auto-revert $short — main CI failed"
          fi
          git push origin HEAD:main
          echo "reverted=true" >> "$GITHUB_OUTPUT"
      # T84: main is green again; the work comes back as a draft PR to fix and re-land. Draft
      # because `check` skips drafts and this tree is known-red. Needs the repo setting
      # "Allow GitHub Actions to create and approve pull requests" (on since T253).
      - name: Open a PR that re-applies the reverted work
        if: steps.revert.outputs.reverted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short "$AFTER")
          # Merged PR -> its head branch and title; direct push to main -> the short sha and
          # the commit subject. T253: the title carries a `[Revert]` prefix.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$AFTER/pulls" \
            --jq '[.[] | select(.merged_at != null)][0] // {}' || echo '{}')
          name=$(jq -r '.head.ref // empty' <<<"$pr")
          title=$(jq -r '.title // empty' <<<"$pr")
          title="[Revert] ${title:-$(git log -1 --format=%s "$AFTER")}"
          branch="revert-${name:-$short}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            branch="$branch-$short"
          fi
          git checkout -b "$branch"
          git revert --no-commit HEAD
          git commit --author="$(git log -1 --format='%an <%ae>' "$AFTER")" \
            -m "Reapply $short — reverted after main CI failed"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "$title" \
            --body "CI failed on main at $AFTER ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), so the push was auto-reverted. This branch re-applies it on top of main: push the fix here, mark the PR ready for review, merge when CI is green."
