name: ci

# Push to main arms `revert-on-failure` (auto-revert of a bad push). That is intentional:
# main must stay green. Pull requests against main are the review gate; draft PRs are skipped
# so half-finished work does not burn runners. `workflow_dispatch` remains for manual runs
# (release branches, one-off checks).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer commit on the same ref cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Draft PRs still emit synchronize; skip until ready_for_review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the Rust version pinned in mise.toml — same toolchain as local.
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Skip slow cache upload on PRs; restore still works from main keys.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just check
      # The webui crate is out of the workspace and builds for wasm only; nothing
      # above compiles it (T81).
      - run: just webui-check
      - run: just example
      # T23.6: `rtok-plugin-sdk` is published on release; a broken manifest fails here.
      - run: just publish-dry

  # T44.4: the agent installers write Windows paths and `%APPDATA%` files; run the suite there.
  # Advisory: `continue-on-error` keeps its result out of `revert-on-failure` until it is green.
  # Temporarily disabled: Windows nextest hang burns runners; restore when suite is stable.
  # windows:
  #   runs-on: windows-latest
  #   continue-on-error: true
  #   # Cap advisory Windows suite: a hung test must not occupy a runner for hours.
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: jdx/mise-action@v4
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         save-if: ${{ github.ref == 'refs/heads/main' }}
  #     - run: mise exec -- cargo nextest run --workspace --no-fail-fast

  revert-on-failure:
    name: revert-on-failure
    needs: [check]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert commits from this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No parent (new branch); skip revert"
            exit 0
          fi
          subject=$(git log -1 --format=%s "$AFTER")
          author=$(git log -1 --format=%an "$AFTER")
          case "$subject" in
            "ci: auto-revert"*) echo "Already an auto-revert; skip"; exit 0 ;;
          esac
          if [ "$author" = "github-actions[bot]" ]; then
            echo "Last commit is from actions bot; skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent_count=$(git rev-list --parents -n 1 "$AFTER" | awk '{print NF}')
          if [ "$parent_count" -gt 2 ]; then
            git revert --no-edit -m 1 "$AFTER"
          else
            git revert --no-commit "$BEFORE".."$AFTER"
            if git diff --cached --quiet; then
              echo "Nothing to revert"
              exit 0
            fi
            short=$(git rev-parse --short "$AFTER")
            git commit -m "ci: auto-revert $short — main CI failed"
          fi
          git push origin HEAD:main
