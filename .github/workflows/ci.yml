name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the Rust version pinned in mise.toml — same toolchain as local.
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: just check
      - run: just example
