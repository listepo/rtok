# T18.5 (P18). A second way in: release-plz keeps a "release: vX.Y.Z" pull request open on main
# with the next version and the changelog; merging it starts the dist Release workflow through
# the same tools/release.sh as bump.yml. Nobody types a version: patch unless a commit since the
# last tag says feat (minor) or breaking (major), and the first release keeps 0.0.1.
#
# release-plz creates neither the tag nor the GitHub Release — dist does both from release.yml —
# and reads the tag dist pushes to learn that a version is out (release-plz.toml).
#
# RELEASE_PLZ_TOKEN (a fine-grained PAT: contents + pull requests, write) is required, not
# optional: GitHub starts no workflow from a GITHUB_TOKEN event, so a pull request opened with the
# default token would be merged having never run ci.yml. T18.6 checks for it and fails loudly.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write # the release branch
  pull-requests: write # the release PR
  actions: write # dispatch release.yml after the merge

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Is this push the merge of a release PR? Only a line that *is* the PR title counts — the
  # squash title, or the title line GitHub adds to a merge commit — never a mention inside a
  # sentence (the commit that added this workflow said "release: vX.Y.Z" in its body and
  # dispatched a release; `contains()` is not line-anchored, an anchored regex is).
  #
  # The optional " (#123)" is GitHub's own doing: squashing appends the pull request number to the
  # title. Merging #3 wrote "release: v0.0.1 (#3)", which a bare `grep -x` missed — v0.0.1 was
  # already out so nothing was lost, but the next merge would have released nothing at all.
  gate:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if git log -1 --format=%B | grep -qE '^release: v[0-9]+\.[0-9]+\.[0-9]+( \(#[0-9]+\))?$'; then
            echo "merged=true" >>"$GITHUB_OUTPUT"
          else
            echo "merged=false" >>"$GITHUB_OUTPUT"
          fi

  release-pr:
    # The merge of the release PR itself has nothing new to propose.
    needs: gate
    if: needs.gate.outputs.merged != 'true'
    runs-on: ubuntu-latest
    steps:
      # T18.6: without the token, `release-plz/action` still opens the pull request — with
      # GITHUB_TOKEN, whose events GitHub refuses to start workflows from. The pull request then
      # carries no CI at all, and the only sign is a checks list that is empty rather than red.
      # Fail here, where the cause is written down. https://release-plz.dev/docs/github/token
      - name: A token that gives the release pull request its CI
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLZ_TOKEN is not set." >&2
            echo "A pull request opened with the default GITHUB_TOKEN starts no workflows," >&2
            echo "so the release would be merged without ci.yml ever having run on it." >&2
            echo "Set a fine-grained PAT with contents + pull-requests write." >&2
            echo "See https://release-plz.dev/docs/github/token" >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags and history decide the next version
      # cargo from mise.toml, same as local and ci.yml
      - uses: jdx/mise-action@v2
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # T18.6: the same gate every pull request passes, on the merge commit this release is cut from.
  verify:
    needs: gate
    if: needs.gate.outputs.merged == 'true'
    uses: ./.github/workflows/verify.yml

  release:
    # Merge or squash: both carry the PR title "release: vX.Y.Z" as its own line.
    needs: [gate, verify]
    if: needs.gate.outputs.merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start the dist Release workflow for the merged version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-bump: dispatch the version Cargo.toml already carries; never raise it here.
        run: tools/release.sh patch --no-bump
