# T18.5 (P18). release-plz keeps a "release: vX.Y.Z" pull request open on main with the next
# version and the changelog; merging it runs verify (`just check` and `just example` on Linux
# and macOS, as bump.yml) on the merge commit, then dispatches the dist Release workflow
# (release.yml, `tag=vX.Y.Z`). release-plz creates neither the tag nor the GitHub Release: dist
# does both from release.yml, and release-plz reads that tag (release-plz.toml).
#
# The flow lives in pyrlyn/infra (release-plz.yml). RELEASE_PLZ_TOKEN (fine-grained PAT:
# contents + pull requests, write) is required: GitHub starts no workflow from a GITHUB_TOKEN
# event, so a release PR opened with the default token would be merged without CI.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    uses: pyrlyn/infra/.github/workflows/release-plz.yml@863d8960601216eec62d4aa78924f84ce61d72b9
    permissions:
      contents: write # the release branch
      pull-requests: write # the release PR
      actions: write # dispatch release.yml after the merge
    with:
      package: rtok
      verify-command: just check && just example
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
