name: sonarcloud

# Main-branch analysis only. No pull_request trigger — Sonar runs after merge (and on
# workflow_dispatch). Draft/PR noise stays on the regular `ci` workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # Empty on forks / when the secret is unset — scan step soft-skips.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    # A hung test is killed by nextest's `terminate-after`; this caps everything else.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same pin as ci.yml — Rust/just from mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Match Justfile recipes: fail the job on fmt or clippy issues before coverage/scan.
      - name: Format check
        run: just fmt-check

      - name: Clippy
        run: just lint

      - name: Generate LCOV coverage
        # `just test-cov` (T301): cargo-llvm-cov from mise.toml over the nextest suite, like
        # `just test` — one process per test and the target/test-home setup script. Plain
        # `cargo test` shares one process, where the proxy tests exhaust httpmock's server
        # pool and hang. Writes coverage/lcov.info. Narrower filters and excluding slow
        # integration tests are follow-ups in docs/sonarcloud-setup.md.
        run: just test-cov

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip SonarCloud (no token)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN is not set; skipping SonarCloud scan."
          echo "Expected for forks and PRs without the repository secret."
          echo "See docs/sonarcloud-setup.md to add the secret on the canonical repo."
