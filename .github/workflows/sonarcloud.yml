name: sonarcloud

# Main-branch analysis only. No pull_request trigger — Sonar runs after merge (and on
# workflow_dispatch). Draft/PR noise stays on the regular `ci` workflow.
on:
  push:
    branches: [main, ci/sonarcloud-oss]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # Empty on forks / when the secret is unset — scan step soft-skips.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same pin as ci.yml — Rust/just from mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Match Justfile recipes: fail the job on fmt or clippy issues before coverage/scan.
      - name: Format check
        run: just fmt-check

      - name: Clippy
        run: just lint

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV coverage
        run: |
          mkdir -p coverage
          # rtok-webui is already outside the workspace; llvm-cov --workspace covers the rest.
          # Follow-ups (narrower filters, exclude slow integration tests) live in
          # docs/sonarcloud-setup.md — do not block the first OSS landing on perfect coverage.
          cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip SonarCloud (no token)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN is not set; skipping SonarCloud scan."
          echo "Expected for forks and PRs without the repository secret."
          echo "See docs/sonarcloud-setup.md to add the secret on the canonical repo."
