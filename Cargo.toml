[package]
name = "rtok"
version = "0.1.0"
edition = "2024"
description = "Token-reduction CLI for AI coding agents: hooks, MCP server and API proxy with pluggable methods"

[[bin]]
name = "rtok"
path = "src/main.rs"

[features]
# One feature per catalogue plugin (plan T0.4). Default = all.
default = ["measure", "cmd", "read", "archive", "proxy", "inject", "guard", "memory", "graph", "toon"]
measure = []
cmd = []
read = ["dep:tree-sitter", "dep:tree-sitter-tags", "lang-rust", "lang-ts", "lang-js", "lang-python", "lang-dart", "lang-c", "lang-go"]
archive = []
proxy = []
inject = []
guard = []
memory = []
graph = []
toon = []
lang-rust = ["dep:tree-sitter-rust"]
lang-ts = ["dep:tree-sitter-typescript"]
lang-js = ["dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-dart = ["dep:tree-sitter-dart"]
lang-c = ["dep:tree-sitter-c"]
lang-go = ["dep:tree-sitter-go"]

[lints.rust]
# Hand-written `unsafe` is forbidden. rustc only reports `UserProvided` blocks —
# macro-expanded `unsafe` is not linted (generated code only).
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
# `unsafe_code = forbid` covers hand-written code; skip macro-expanded unsafe here.
undocumented_unsafe_blocks = "allow"
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
figment = { version = "0.10", features = ["toml", "env"] } # config layering + per-key provenance (D14)
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] } # D13 typed models
libsqlite3-sys = { version = "0.30", features = ["bundled"] } # FTS5 in the SQLite bundle
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10" # call_io archive checksums (T13.3)
toml_edit = "0.22" # `config set` (T12.3) edits in place, preserving comments
rmcp = { version = "0.8" } # stdio MCP types + JSON-RPC (T4.1)
ignore = "0.4" # gitignore-aware walk for search/tree (T4.5)
regex = "1" # search pattern (T4.5)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
axum = "0.8.9"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls"] }
tree-sitter = { version = "0.25", optional = true } # parser for map/signatures (T4.3)
tree-sitter-tags = { version = "0.25", optional = true } # definition tags from grammar queries (T4.3)
tree-sitter-rust = { version = "0.24.2", optional = true } # lang-rust tags (T4.3)
tree-sitter-javascript = { version = "0.23", optional = true } # lang-js tags (T4.3)
tree-sitter-typescript = { version = "0.23", optional = true } # lang-ts tags (T4.3)
tree-sitter-python = { version = "0.23", optional = true } # lang-python tags (T4.3)
tree-sitter-c = { version = "0.23", optional = true } # lang-c tags (T4.3)
tree-sitter-go = { version = "0.23", optional = true } # lang-go tags (T4.3)
tree-sitter-dart = { version = "0.2", optional = true } # lang-dart tags (T4.3)

[dev-dependencies]
httpmock = "0.8" # mock Anthropic/OpenAI upstreams for proxy tests (T5.0)
