# The binary crate is the workspace root (T23.1, D25). `rtok-plugin-sdk` is the published
# plugin contract; `crates/rtok-webui` is excluded because it builds for wasm through its own
# toolchain and must not join `cargo test` here.
[workspace]
members = ["crates/rtok-agent-sdk", "crates/rtok-hook", "crates/rtok-plugin-sdk", "crates/rtok-sys", "crates/rtok-wasm-demo-guest"]
exclude = ["crates/rtok-webui"]

[package]
name = "rtok"
version = "0.7.0"
edition = "2024"
repository = "https://github.com/listepo/rtok" # cargo-dist hosting (T10.4)
# Both fields are also what dist reads when it builds a Homebrew formula — off today, kept
# commented out in dist-workspace.toml to be fixed later, so leave them in place.
homepage = "https://listepo.github.io/rtok/"
description = "Token-reduction CLI for AI coding agents: hooks, MCP server and API proxy with pluggable methods"
# T23.6: only `rtok-plugin-sdk` is published. A release of the binary is a tag plus dist
# archives, and `cargo publish` at the workspace level must not reach this package.
publish = false

# Opt the binary back into cargo-dist: publish = false would otherwise hide it from
# `dist generate` / Release (same as cargo-dist's own guidance).
[package.metadata.dist]
dist = true
# Host plugins must ship beside the binary: setup resolves `plugins/<host>` next
# to `current_exe()` for installed archives (Windows zip / unix tarballs).
# The web UI is not here: T111 compiles it into the binary (build.rs), because a ketch
# install keeps only the executable.
include = ["plugins/", "skills/"]

[[bin]]
name = "rtok"
path = "src/main.rs"

# T178/D32: the std-only hook client; a bin of this package so it shares rtok's version.
[[bin]]
name = "rtok-hook"
path = "src/bin/rtok-hook.rs"

[[bench]]
name = "graph"
harness = false

[features]
# One feature per catalogue plugin (plan T0.4). Default = all.
default = ["measure", "cmd", "read", "archive", "proxy", "inject", "guard", "memory", "graph", "toon", "compress"]
measure = []
cmd = []
read = ["dep:tree-sitter", "dep:tree-sitter-tags", "lang-rust", "lang-ts", "lang-js", "lang-python", "lang-dart", "lang-c", "lang-go", "lang-java", "lang-kotlin", "lang-swift", "lang-csharp", "lang-ruby", "lang-php"]
archive = []
proxy = []
inject = []
guard = []
memory = []
graph = ["read"]
# Opt-in only (P8d T8.17): the graph watcher reads Meta's watchman daemon instead of
# notify's FSEvents/kqueue/inotify. Joins `default` only if Gate P8d (3) and (5) pass.
graph-watchman = ["graph", "dep:watchman_client"]
toon = []
wasm-host = ["dep:wasmi"]
compress = []
lang-rust = ["dep:tree-sitter-rust"]
lang-ts = ["dep:tree-sitter-typescript"]
lang-js = ["dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-dart = ["dep:tree-sitter-dart"]
lang-c = ["dep:tree-sitter-c"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-swift = ["dep:tree-sitter-swift"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-php = ["dep:tree-sitter-php"]

[lints.rust]
# Hand-written `unsafe` is forbidden. rustc only reports `UserProvided` blocks —
# macro-expanded `unsafe` is not linted (generated code only).
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
# `unsafe_code = forbid` covers hand-written code; skip macro-expanded unsafe here.
undocumented_unsafe_blocks = "allow"
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"

[dependencies]
anyhow = "1.0.104"
rtok-plugin-sdk = { version = "0.0.1", path = "crates/rtok-plugin-sdk" } # the plugin contract (D25)
rtok-agent-sdk = { version = "0.0.1", path = "crates/rtok-agent-sdk" }   # the agent-host contract (D28)
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.6" # `rtok completions` (T53.2)
clap_mangen = "0.3" # `rtok man` (T53.2)
figment = { version = "0.10", features = ["toml", "env"] } # config layering + per-key provenance (D14)
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] } # D13 typed models
libsqlite3-sys = { version = "0.38", features = ["bundled"] } # FTS5 in the SQLite bundle
rtok-sys = { path = "crates/rtok-sys" } # demon kill/setsid + flock (Windows-safe shims; rustix stays inside rtok-sys on Unix)
rtok-hook = { path = "crates/rtok-hook" } # T178/D31: wire format shared with the std-only hook client
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11" # call_io archive checksums (T13.3)
similar = "3.2" # unified diff for `--dry-run` output (T12.6); already in the lock via dev-deps
wasmi = { version = "2.0", optional = true } # pure-Rust WASM interpreter for optional out-of-tree plugin host (P32)
toml_edit = "0.25" # `config set` (T12.3) edits in place, preserving comments
dotenvy = "0.15" # `.env` files as a config layer, parse only (T12.5)
dunce = "1" # canonicalize without Windows UNC prefixes (graph index keys + file:// URIs)
pathdiff = "0.2" # relative path of a file under a repo root (graph LSP + index)
rmcp = { version = "3.2" } # stdio MCP types + JSON-RPC (T4.1)
url = "2.5" # file:// MCP roots → path (T263)
ignore = "0.4" # gitignore-aware walk for search/tree (T4.5)
notify = "9.0.0-rc.5" # recursive file watching for the graph background indexer (T8.16); 9 drops windows-sys 0.60 (T223)
watchman_client = { version = "0.9", optional = true } # Meta's watchman client for the T8.17 watcher backend (tokio, already a dependency); behind `graph-watchman`
indicatif = "0.18" # progress for `graph index` (T21.2); `ProgressBar::hidden()` keeps it off the MCP path
owo-colors = { version = "4", features = ["supports-colors"] } # ANSI + the tty/NO_COLOR/CLICOLOR/TERM=dumb question in one call (T20.2)
printpdf = "0.12.8" # paged-PDF renderer for `rtok report --format pdf` (T22.0 survey choice, T22.3)
regex = "1" # search pattern (T4.5)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
axum = { version = "0.8.9", features = ["ws"] } # dashboard WebSocket (P19); proxy HTTP unchanged
tower-http = { version = "0.7", features = ["fs"] } # ServeDir for Slint WASM assets
futures-util = "0.3.34"
ratatui = "0.30.2" # `rtok tui`, the terminal rendering of the D23 model (T15.1); default backend is crossterm
crossterm = "0.29" # key and tick events for the TUI loop (T15.1); same major as ratatui 0.30's backend, so one copy links
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls"] }
rustls = "0.23" # preconfigured webpki TLS for proxy/otel (T53.3)
rustls-pemfile = "2.2" # SSL_CERT_FILE bundle parsing (T53.3)
webpki-roots = "1" # Mozilla roots without the platform verifier (T53.3)
tree-sitter = { version = "0.25", optional = true } # parser for map/signatures (T4.3)
tree-sitter-tags = { version = "0.25", optional = true } # definition tags from grammar queries (T4.3)
tree-sitter-rust = { version = "0.24.2", optional = true } # lang-rust tags (T4.3)
tree-sitter-javascript = { version = "0.25", optional = true } # lang-js tags (T4.3)
tree-sitter-typescript = { version = "0.23", optional = true } # lang-ts tags (T4.3)
tree-sitter-python = { version = "0.25", optional = true } # lang-python tags (T4.3)
tree-sitter-c = { version = "0.24", optional = true } # lang-c tags (T4.3)
tree-sitter-go = { version = "0.25", optional = true } # lang-go tags (T4.3)
tree-sitter-dart = { version = "0.2", optional = true } # lang-dart tags (T4.3)
tree-sitter-java = { version = "0.23.5", optional = true } # lang-java tags (T52.2)
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true } # lang-kotlin tags (T52.2); fwcd 0.3.8 needs tree-sitter <0.23
tree-sitter-swift = { version = "0.7.3", optional = true } # lang-swift tags (T52.2)
tree-sitter-c-sharp = { version = "0.23.5", optional = true } # lang-csharp tags (T52.2)
tree-sitter-ruby = { version = "0.23.1", optional = true } # lang-ruby tags (T52.2)
tree-sitter-php = { version = "0.24.2", optional = true } # lang-php tags (T52.2)
jsonc-parser = { version = "0.33.2", features = ["serde"] } # JSONC (comments + trailing commas) parse of Zed settings (T222)
log = "0.4.34" # T225: logging facade; env_logger drains it, every D26 line is mirrored into it
env_logger = "0.11.11" # T225: `RUST_LOG` debug log on stderr; the filter defaults to `off`, not `error`

[dev-dependencies]
assert_cmd = "2" # CLI e2e through `Command::cargo_bin` (plan Working agreement)
divan = "0.1" # divan benches in benches/ (default harness for new benches)
httpmock = "0.8" # mock Anthropic/OpenAI upstreams for proxy tests (T5.0)
insta = "1" # snapshot tests for stable text output
rstest = "0.27.0" # parameterized unit tests; #[rstest] instead of #[test] (T36.5)
trycmd = "1.2.1" # full CLI command-output fixtures in tests/trycmd/
tokio-tungstenite = "0.30" # real WebSocket client for the `rtok web` e2e (tests/web_e2e.rs); already in the tree via axum "ws"
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] } # tests hold a competing writer on the store file (same crate/features as [dependencies], T75)

# T17.1. No profile may set `panic = "abort"`: `hooks::dispatch` fails open through five
# `catch_unwind` sites, and aborting would break the rule that a hook exits 0 on error.
[profile.dev]
# Backtraces keep `file:line`; the full DWARF that dominated every artifact goes.
debug = "line-tables-only"

# Nobody steps through the 450-odd dependencies, but their debug info is copied into every
# one of the integration test binaries (one per file under tests/*.rs), which is most of
# what the linker moves on a dev rebuild. Workspace code is not matched by `"*"`, so it
# keeps its line tables.
[profile.dev.package."*"]
debug = false

# Build scripts and proc macros are run, not debugged.
[profile.dev.build-override]
debug = false

[profile.release]
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1 # the shipped binary is built once; trade build time for size
