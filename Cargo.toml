[package]
name = "rtok"
version = "0.1.0"
edition = "2024"
description = "Token-reduction CLI for AI coding agents: hooks, MCP server and API proxy with pluggable methods"

[[bin]]
name = "rtok"
path = "src/main.rs"

[features]
# One feature per catalogue plugin (plan T0.4). Default = all.
default = ["measure", "cmd", "read", "archive", "proxy", "inject", "guard", "memory", "graph", "toon"]
measure = []
cmd = []
read = []
archive = []
proxy = []
inject = []
guard = []
memory = []
graph = []
toon = []

[lints.rust]
# Hand-written `unsafe` is forbidden. rustc only reports `UserProvided` blocks —
# macro-expanded `unsafe` is not linted (generated code only).
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
# `unsafe_code = forbid` covers hand-written code; skip macro-expanded unsafe here.
undocumented_unsafe_blocks = "allow"
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
figment = { version = "0.10", features = ["toml", "env"] } # config layering + per-key provenance (D14)
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] } # D13 typed models
libsqlite3-sys = { version = "0.30", features = ["bundled"] } # FTS5 in the SQLite bundle
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10" # call_io archive checksums (T13.3)
toml_edit = "0.22" # `config set` (T12.3) edits in place, preserving comments
rmcp = { version = "0.8" } # stdio MCP types + JSON-RPC (T4.1)

[dev-dependencies]
httpmock = "0.8" # mock Anthropic/OpenAI upstreams for proxy tests (T5.0)