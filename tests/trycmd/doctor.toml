bin.name = "rtok"
args = "--config tests/trycmd/input/json-readers.toml doctor"
stdout = """
hooks 0
mcp
  rtok ([..] tools, ~[..] desc tokens) [..]
proxy 
proxy openai 
BASH_MAX_OUTPUT_LENGTH (unset)
autoCompactWindow (unset)
read-share no data
agents
  claude (cli)
    ✗ hooks   not installed
    ✗ mcp     not installed
    ✗ proxy   not installed (--proxy)
    − plugin  not supported: Claude Code loads hooks and MCP from its own settings; there is no plugin directory to link
  claude (desktop)
    − hooks   not supported: Claude Desktop has no hook events
    ✗ mcp     not installed
    − proxy   not supported: Claude Desktop has no base-URL setting; its requests do not pass through the proxy
    − plugin  not supported: Claude Desktop loads MCP from claude_desktop_config.json; there is no plugin directory to link
  cursor (cli)
    ✗ hooks   not installed
    ✗ mcp     not installed
    − proxy   not supported: Cursor has no base-URL setting to point at the proxy
    ✗ plugin  not installed (--yes)
  cursor (desktop)
    ✗ hooks   not installed
    ✗ mcp     not installed
    − proxy   not supported: Cursor has no base-URL setting to point at the proxy
    ✗ plugin  not installed (--yes)
  codex (cli)
    − hooks   not supported: Codex has no shell hook events
    ✗ mcp     not installed
    ✗ proxy   not installed (--proxy)
    − plugin  not supported: Codex loads MCP from config.toml; there is no plugin directory to link
  opencode (cli)
    − hooks   not supported: OpenCode has no shell hook events; the linked plugin filters bash output instead
    ✗ mcp     not installed
    ✗ proxy   not installed
    ✗ plugin  not installed (--yes)
  opencode (desktop)
    − hooks   not supported: OpenCode has no shell hook events; the linked plugin filters bash output instead
    ✗ mcp     not installed
    ✗ proxy   not installed
    ✗ plugin  not installed (--yes)
  pi (cli)
    − hooks   not supported: pi has no hook events; the extension owns the bash call path
    − mcp     not supported: pi philosophy is no MCP; the extension calls rtok run and rtok filter directly
    − proxy   not supported: pi provider base URLs live in its models config, which setup does not edit
    ✗ plugin  not installed (--yes)
  zcode (desktop)
    ✗ hooks   not installed
    ✗ mcp     not installed
    − proxy   not supported: ZCode providers are per-id tables with their own keys and base URLs; setup does not edit them
    − plugin  not supported: ZCode plugins come from the Z.ai marketplace; there is no local plugin directory to link
  kimi (cli)
    ✗ hooks   not installed
    ✗ mcp     not installed
    − proxy   not supported: Kimi Code providers are [providers.<name>] tables with their own base_url and keys; setup does not edit them
    − plugin  not supported: Kimi Code plugins live in plugins/managed/, owned by `kimi plugin install`; there is no local plugin directory to link
  copilot (cli)
    ✗ hooks   not installed
    ✗ mcp     not installed
    − proxy   not supported: Copilot BYOK is env-only (COPILOT_PROVIDER_BASE_URL); there is no config file to point at the proxy
    − plugin  not supported: Copilot plugins live in installed-plugins/, owned by `copilot plugin`; there is no local plugin directory to link
  copilot (desktop)
    − hooks   not supported: the GitHub Copilot app does not document hooks; the shared hooks/rtok.json is written for the CLI
    ✗ mcp     not installed
    − proxy   not supported: Copilot BYOK is env-only (COPILOT_PROVIDER_BASE_URL); there is no config file to point at the proxy
    − plugin  not supported: Copilot plugins live in installed-plugins/, owned by `copilot plugin`; there is no local plugin directory to link
  aider (cli)
    − hooks   not supported: aider has no hook events; it reads .aider.conf.yml and .env
    − mcp     not supported: aider has no MCP support
    ✗ proxy   not installed (--proxy)
    − plugin  not supported: aider has no plugin directory to link
  windsurf (desktop)
    − hooks   not supported: Cascade hooks speak agent_action_name/tool_info, not hook_event_name/tool_name; rtok hook has no --host windsurf mapping
    ✗ mcp     not installed
    − proxy   not supported: Windsurf serves its own models; there is no documented base-URL setting to point at the proxy
    − plugin  not supported: Cascade has no local plugin directory to link; rules and memories live in .windsurf/
  zed (cli)
    − hooks   not supported: Zed has no shell hook events; its agent runs tools itself and takes external agents over ACP
    ✗ mcp     not installed
    − proxy   not supported: Zed serves hosted models or provider API keys; there is no documented base-URL setting to point at the proxy
    − plugin  not supported: Zed extensions install from the marketplace; there is no local directory to link
  zed (desktop)
    − hooks   not supported: Zed has no shell hook events; its agent runs tools itself and takes external agents over ACP
    ✗ mcp     not installed
    − proxy   not supported: Zed serves hosted models or provider API keys; there is no documented base-URL setting to point at the proxy
    − plugin  not supported: Zed extensions install from the marketplace; there is no local directory to link
...
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t60-2-doctor"
RTOK_HOME = "target/tmp/t60-2-doctor"
