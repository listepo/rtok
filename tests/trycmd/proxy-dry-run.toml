bin.name = "rtok"
args = "--config tests/trycmd/input/json-readers.toml proxy --dry-run"
stdout = """
bind = 127.0.0.1
port = 8790
mode = passthrough
upstream = https://api.anthropic.com
openai_upstream = https://api.openai.com
timeout_s = 600
include_usage = true
dry_run = true
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t60-2-proxy-dry-run"
RTOK_HOME = "target/tmp/t60-2-proxy-dry-run"
