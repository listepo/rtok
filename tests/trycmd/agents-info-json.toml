bin.name = "rtok"
args = "--config tests/trycmd/input/json-readers.toml agents info claude --json"

# Hermetic by construction: fixture pins transcripts, the store lands under
# target/ via RTOK_HOME, and a cleared env keeps ambient RTOK_* / HOME out.
[env]
inherit = false
RTOK_HOME = "target/tmp/t72-agents-info-json"
