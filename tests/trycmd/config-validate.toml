bin.name = "rtok"
args = "--config tests/trycmd/input/bench-config.toml config validate tests/trycmd/input/bench-config.toml"
stdout = """
ok tests/trycmd/input/bench-config.toml
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t60-2-config-validate"
RTOK_HOME = "target/tmp/t60-2-config-validate"
