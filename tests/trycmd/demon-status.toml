bin.name = "rtok"
args = "--config tests/trycmd/input/json-readers.toml demon status"
stdout = """
service    state      endpoint          supervisor  child     uptime    restarts  log
proxy      stopped    127.0.0.1:8790    -           -         -         -         [..]/demon/proxy.log
mcp        stopped    -                 -           -         -         -         [..]/demon/mcp.log
web        stopped    -                 -           -         -         -         [..]/demon/web.log
hook       stopped    -                 -           -         -         -         [CWD]/target/tmp/t60-2-demon-status/demon/hook.log
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t60-2-demon-status"
RTOK_HOME = "target/tmp/t60-2-demon-status"
