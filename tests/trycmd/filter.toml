bin.name = "rtok"
args = "filter --cmd \"git status\""
stdin = """
On branch main
Changes not staged for commit:
	modified:   src/lib.rs
"""
stdout = """
On branch main
modified:   src/lib.rs
[rtok c6a9698fdee17f8f72bd106dc8a69ce4d5661e6913fadb2c41c24371cf8d1506 · 3 lines · expand: rtok expand c6a9698fdee17f8f72bd106dc8a69ce4d5661e6913fadb2c41c24371cf8d1506]
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t60-2-filter"
RTOK_HOME = "target/tmp/t60-2-filter"
SHELL = "/bin/sh"
