bin.name = "rtok"
args = "mcp"
stdin = """
{"jsonrpc":"2.0","id":1,"method":"tools/list"}
"""
stdout = """
{"id":1,"jsonrpc":"2.0","result":{"resultType":"complete","tools":[{"description":"Return archived payload by id; optional lines a-b, regex grep (hits as N:line), context N.","inputSchema":{"properties":{"context":{"type":"integer"},"grep":{"type":"string"},"id":{"type":"string"},"lines":{"type":"string"}},"required":["id"],"type":"object"},"name":"expand"},{"description":"Read a file; mode full|lines|map|signatures; range a-b for full|lines.","inputSchema":{"properties":{"mode":{"type":"string"},"path":{"type":"string"},"range":{"type":"string"}},"required":["path"],"type":"object"},"name":"read"},{"description":"Regex search files; path:line: snippet, max hits.","inputSchema":{"properties":{"max":{"type":"integer"},"path":{"type":"string"},"pattern":{"type":"string"}},"required":["pattern"],"type":"object"},"name":"search"},{"description":"Compact directory listing with sizes; depth cap.","inputSchema":{"properties":{"depth":{"type":"integer"},"path":{"type":"string"}},"type":"object"},"name":"tree"},{"description":"Save a note (kind, title, body); same project+kind+title updates it.","inputSchema":{"properties":{"body":{"type":"string"},"kind":{"type":"string"},"project":{"type":"string"},"title":{"type":"string"}},"required":["kind","title","body"],"type":"object"},"name":"mem_save"},{"description":"Search notes by FTS5; ids, titles, snippets.","inputSchema":{"properties":{"limit":{"type":"integer"},"query":{"type":"string"}},"required":["query"],"type":"object"},"name":"mem_search"},{"description":"Return one note body by id.","inputSchema":{"properties":{"id":{"type":"integer"}},"required":["id"],"type":"object"},"name":"mem_get"},{"description":"Retire (tombstone, never delete) or pin a note by id.","inputSchema":{"properties":{"id":{"type":"integer"},"pinned":{"type":"boolean"},"retire":{"type":"boolean"},"superseded_by":{"type":"integer"}},"required":["id"],"type":"object"},"name":"mem_update"},{"description":"Definitions of a symbol with their source: path:line kind, then the body. Optional path substring and kind narrow the match.","inputSchema":{"properties":{"kind":{"type":"string"},"name":{"type":"string"},"path":{"type":"string"}},"required":["name"],"type":"object"},"name":"symbol"},{"description":"Which definitions reference a symbol: path, calling definition, count. Optional path substring keeps one subtree.","inputSchema":{"properties":{"name":{"type":"string"},"path":{"type":"string"}},"required":["name"],"type":"object"},"name":"callers"},{"description":"What breaks if a symbol changes: callers, their callers, up to depth. Optional path substring keeps one subtree.","inputSchema":{"properties":{"depth":{"type":"integer"},"name":{"type":"string"},"path":{"type":"string"}},"required":["name"],"type":"object"},"name":"impact"},{"description":"Definitions in one file (read mode=map).","inputSchema":{"properties":{"path":{"type":"string"}},"required":["path"],"type":"object"},"name":"outline"},{"description":"Answers a code question: the query's symbols as definitions with bodies, call paths between them, impact counts. Optional path narrows.","inputSchema":{"properties":{"path":{"type":"string"},"query":{"type":"string"}},"required":["query"],"type":"object"},"name":"explore"}]}}
