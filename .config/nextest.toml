# Windows CI previously hung forever in `cargo nextest` after the wasm LNK stubs
# landed (run 35225713659 job windows: nextest still in_progress after >2h;
# earlier Windows jobs failed at link in ~5m and never reached the suite).
# Mark slow at 60s; kill after 3 periods so a stuck wait_with_output/test is named
# in the log instead of holding the runner until the GHA 6h ceiling.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# CPU/memory-heavy tests run alone. `threads-required = "num-test-threads"` makes each
# matching test reserve the whole `--test-threads` pool (see `just test`, which sets `-j`
# to the system CPU count), so a heavy test never shares the machine with the rest of the
# suite. The three below are the ones that swamp a box:
#   - labelled_symbols_are_found  cold-indexes the whole repo; its `each_parsed` walk
#                                 already spawns one worker per core.
#   - memory_recall_bench          seeds a 100-session in-memory store (P29 embeddings).
#   - the graph_bench pair         build 3 000-file trees. They are `#[ignore]` release
#                                 benches (their headers ask for `--test-threads=1`), so the
#                                 override only bites under `--run-ignored`.
[[profile.default.overrides]]
filter = 'test(/labelled_symbols_are_found/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'test(/memory_recall_bench/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'test(/p8c_numbers|p8c_one_edit_reads_one_file_under_10ms/)'
threads-required = "num-test-threads"


# trycmd spawns the real rtok binary for every case; under a full-suite parallel run its
# output drifted 3x on 2026-09-20/21 (fast, load-only failures; green standalone and in
# CI). Isolate the runner on the machine like the heavy benches above -- each case still
# runs, just not sharing CPUs with the rest of the suite.
[[profile.default.overrides]]
filter = 'binary(cli_trycmd)'
threads-required = "num-test-threads"

# T82: tests that fail on `windows-latest`, skipped there by name so the CI `windows` job is
# green and any other failure is a regression. Sources: ci run 35244082778 (2026-09-17, 22
# failed / 3 timed out) and run 35576438155 (2026-09-21, the last 4 lines, after T93's stack
# fix). Windows only — Linux and macOS select every test as before.
# T83 fixes them family by family: delete a line when its tests pass, delete the override
# when the list is empty. `--ignore-default-filter` runs them anyway.
[[profile.default.overrides]]
platform = 'cfg(windows)'
default-filter = '''
not (
    (binary(demon) & test(/^(a_service_that_exits_comes_back_and_stop_takes_the_whole_tree_down|status_asks_the_kernel_rather_than_believing_the_state_file|a_second_start_is_refused_and_status_names_every_service)$/))
  | (binary(otel) & test(=hooks_stay_fast_with_an_unreachable_endpoint))
  | (binary(commands_e2e) & test(=run_long_output_then_expand_round_trips))
  | (binary(agents_install) & test(/^(list_reports_installed_modules_per_host|setup_twice_takes_one_backup_and_says_already_installed)$/))
  | (binary(agents_doc) & test(=agents_doc_table_matches_the_host_code))
  | (binary(cli_trycmd) & test(=cli))
  | (binary(opencode_plugin) & test(=dry_run_offers_the_plugin_and_writes_nothing))
  | (binary(cursor_plugin) & test(/^(setup_cursor_dry_run_offers_plugin|setup_cursor_yes_links_plugin_without_mcp_json|setup_cursor_clears_leftover_mcp_when_plugin_already_linked)$/))
  | (binary(pi_plugin) & test(/^(setup_pi_dry_run_offers_plugin|setup_pi_yes_links_remove_unlinks|pi_extension_unit_test_with_fake_rtok)$/))
  | (binary(filter) & test(=opencode_plugin_unit_test_with_api_mock))
  | test(/^plugins::cmd::run::tests::(one_arg_compound_command_runs_as_one_script|exit_3_is_preserved|printf_two_lines_exit_0_no_trailer|three_runs_stats_plugin_cmd_json_has_rows)$/)
  | test(=plugins::cmd::formatters::tests::ten_families_and_aws_key_unredacted)
  | test(=demon::tests::a_service_that_writes_past_max_bytes_gets_a_rotated_log)
  | test(/^log::tests::(rotation_keeps_files_plus_the_current_one_and_the_newest_line_is_in_it|a_rotation_storm_between_polls_prints_every_line_once|a_rotation_decided_on_a_stale_size_is_dropped_under_the_lock)$/)
  | test(=agents::claude::tests::desktop_writes_absolute_rtok_into_claude_desktop_config)
  | test(=plugins::cmd::run::tests::identical_output_from_different_commands_dedups)
  | test(=plugins::read::cache::tests::vfs_small_change_is_hunks_large_is_full_missing_archive_is_full)
  | (binary(agent_remove) & test(=uninstall_clears_the_installed_marks_over_a_materialized_plugin_copy))
  | (binary(plugins_e2e) & test(=graph_session_start_map_off_by_default_and_on_when_capped))
)
'''
