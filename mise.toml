[tools]
"cargo:cargo-cache" = "0.8.3" # `just cache` / `just cache-autoclean` (T17.2); the shared cargo home fills up
git-cliff = "2.13.1"
go = "1.27.0" # hugo resolves the hextra theme as a Go module (site/go.mod)
hugo = "0.165.0"
just = "1.58.0"
node = "26.8.2" # jscpd runs on it; nothing in the binary does
"npm:jscpd" = "5.1.2" # `just dup` (T26.0): copy-paste detector, config in .jscpd.json
rust = { version = "1.97.1", components = "rustfmt,clippy" } # CI otherwise installs the minimal profile
