[package]
name = "rtok-webui"
version = "0.0.1"
edition = "2021"
publish = false
description = "Slint WASM operator UI for `rtok dashboard`"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
slint = { version = "1.14", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "BinaryType",
] }

[build-dependencies]
slint-build = "1.14"
