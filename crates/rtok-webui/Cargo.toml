[package]
name = "rtok-webui"
version = "0.0.1"
edition = "2021"
publish = false
description = "Slint WASM operator UI for `rtok dashboard`"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "EventTarget",
    "Location",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "BinaryType",
    "Storage",
    "MediaQueryList",
] }

[build-dependencies]
slint-build = "1.18"

# Slint's recommended headless backend for integration tests (tests/e2e.rs):
# `=` pin is mandatory — the crate ignores semver and must match `slint` exactly.
[dev-dependencies]
i-slint-backend-testing = "=1.18.0"

# T60.7: size-first release profile for the WASM operator UI. `tests/web_wasm.rs` holds
# every line here; opt-level "s" measured 4,738,453 B against 4,344,475 B for "z".
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# wasm-pack runs wasm-opt with `-O` unless told otherwise, and that is the only pass the
# release runners get (they have no binaryen on PATH): 4,522,155 B in run 36165796413.
# `-Oz --converge` brings the same build to 4,344,475 B on every machine alike.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--converge"]
