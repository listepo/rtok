  <a class="rtok-pyrlyn-credit" href="https://github.com/pyrlyn" target="_blank" rel="noopener noreferrer">

    <img class="hx:block hx:dark:hidden" src="{{ "pyrlyn/pyrlyn-lockup-on-light.svg" | relURL }}" alt="Pyrlyn" width="96" height="22" loading="lazy" />
    <img class="hx:hidden hx:dark:block" src="{{ "pyrlyn/pyrlyn-lockup-on-dark.svg" | relURL }}" alt="Pyrlyn" width="96" height="22" loading="lazy" />
  </a>
