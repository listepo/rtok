{{- /* rtok: theme 404 (hextra v0.12.3) plus a home link and the "by Pyrlyn" credit. The page has
       no theme CSS, so the logo follows prefers-color-scheme like the page colours do. */ -}}
<!doctype html>
<html lang="{{ .Site.Language.Lang | default "en" }}" dir="{{ partial "utils/hugo-compat/language-direction.html" .Site.Language | default "ltr" }}">
  <body
    style='font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji"; height:100vh; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center'
  >
    <main id="content">
      <style>
        body {
          color: #000;
          background: #fff;
          margin: 0;
        }

        .hextra-error-h1 {
          border-right: 1px solid rgba(0, 0, 0, 0.3);
        }

        @media (prefers-color-scheme: dark) {
          body {
            color: #fff;
            background: #000;
          }

          .hextra-error-h1 {
            border-right: 1px solid rgba(255, 255, 255, 0.3);
          }
        }
      </style>
      <h1
        class="hextra-error-h1"
        style='display: inline-block; margin: 0 20px 0 0; padding-right: 23px; font-size: 24px; font-weight: 500; vertical-align: top; line-height: 49px; font-feature-settings: "rlig" 1,"calt" 1,"ss01" 1,"ss06" 1 !important;'
      >
        404
      </h1>
      <div style="display: inline-block; text-align: left">
        <h2 style="font-size: 14px; font-weight: 400; line-height: 49px; margin: 0">This page could not be found.</h2>
      </div>
      <p class="rtok-404-links" style="margin: 32px 0 0; font-size: 14px; display: flex; gap: 16px; align-items: center; justify-content: center">
        <a href="{{ "" | relURL }}" style="color: inherit">rtok home</a>
        <a href="https://github.com/pyrlyn" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none; display: inline-flex; gap: 6px; align-items: center">
          <span>by</span>
          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="{{ "pyrlyn/pyrlyn-lockup-on-dark.svg" | relURL }}" />
            <img src="{{ "pyrlyn/pyrlyn-lockup-on-light.svg" | relURL }}" alt="Pyrlyn" width="96" height="22" style="display: block" />
          </picture>
        </a>
      </p>
    </main>
  </body>
</html>
